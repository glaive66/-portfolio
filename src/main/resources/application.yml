server:
  port: 8080

spring:
  application:
    name: autoops-mcp

  # 1. PostgreSQL Datasource Configuration
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:autoops_db}
    username: ${DB_USER:autoops}
    password: ${DB_PASSWORD:autoops123!}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: AutoOpsHikariPool
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # 2. JPA / Hibernate Configuration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
        jdbc:
          time_zone: Asia/Seoul

  # 3. RabbitMQ Configuration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        acknowledge-mode: auto
        concurrency: 2
        max-concurrency: 5
        retry:
          enabled: true
          initial-interval: 1000ms
          max-attempts: 3
          multiplier: 2.0

  # 4. Spring AI: Multi-LLM 호환 설정 (기본값: Google Gemini 2.0 Flash 무료 티어 엔드포인트)
  ai:
    openai:
      base-url: ${AI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai/}
      api-key: ${GEMINI_API_KEY:mock-free-tier-key}
      chat:
        options:
          model: ${AI_MODEL:gemini-2.0-flash}
          temperature: 0.1

# 5. MyBatis Configuration
mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.autoops.domain
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 30

# 6. Logging
logging:
  level:
    root: INFO
    com.autoops: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.ai: INFO
